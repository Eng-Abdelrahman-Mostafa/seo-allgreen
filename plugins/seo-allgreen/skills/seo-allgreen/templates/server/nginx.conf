# nginx equivalent of server/Caddyfile. UNTESTED as written (derived from the
# Caddy behaviour, which was curl-tested) — curl /x, /x/, a bare dir and an
# unknown path before shipping. Keep both in sync if you ship both, but change
# the one production actually runs first.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's own implicit directory redirects (/x → /x/) use the ORIGIN scheme,
    # i.e. http:// behind a TLS proxy. The explicit absolute https rewrite in
    # `location /` below is what prevents that downgrade — keep it.

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/json
               application/javascript image/svg+xml font/ttf font/otf;
    # gzip_static on;  # only if prerender deleted the stale .gz/.br (it does)

    location ~* \.(?:js|mjs|css|woff2?|ttf|otf|png|jpe?g|gif|webp|avif|ico|mp4|webm)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex";   # crawlable for rendering, never indexed
        access_log off;
        try_files $uri =404;
    }

    location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }
    location = /llms.txt    { add_header Cache-Control "public, max-age=3600"; default_type "text/plain; charset=utf-8"; }

    location / {
        # /blog (a pre-rendered dir) -> one absolute 301 to /blog/
        if (-f "$document_root$uri/index.html") {
            rewrite ^(.+[^/])$ https://example.com$1/ permanent;
        }
        # NOT `$uri/` (nginx then 301s itself, relative) and NOT /index.html as fallback.
        try_files $uri/index.html $uri /app.html;
        add_header Cache-Control "no-cache";
    }
}
