name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build skill zip (folder at the zip root, for Claude apps upload)
        run: cd plugins/seo-allgreen/skills && zip -rq "$GITHUB_WORKSPACE/seo-allgreen.zip" seo-allgreen
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" seo-allgreen.zip --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
